name: Tests
on:
  workflow_dispatch:
  pull_request:
    paths:
    - 'src/**'
    - justfile
    - pyproject.toml
    - uv.lock
    - .github/workflows/tests.yaml

# Cancel any ongoing run of this workflow on the same PR or ref
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Add the path of Intel MPI DLL: For some reason uv doesn't take it into account
          # in the github runner
          $env:PATH = "$($PWD.Path)\.venv\Library\bin;$env:PATH"
          just test -x
      - name: Run tests (*nix)
        if: runner.os != 'Windows'
        run: just test -x
