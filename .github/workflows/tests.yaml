name: Tests
on:
  workflow_dispatch:
  pull_request:
    paths:
    - 'src/**'
    - justfile
    - pyproject.toml
    - uv.lock
    - .github/workflows/tests.yaml

# Cancel any ongoing run of this workflow on the same PR or ref
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Add the path of Intel MPI DLL: For some reason uv doesn't take it into account
          # in the github runner
          $env:PATH = "$($PWD.Path)\.venv\Library\bin;$env:PATH"
          just test -x
      - name: Run tests (*nix)
        if: runner.os != 'Windows'
        run: just test -x
